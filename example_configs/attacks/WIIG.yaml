name: WellInformedInvertingGradients

seed: 42 # dummy init is reseeded with seed + trial, so all attacks start from the same dummy
collect_loss_history: true

imitate_dropout: true
train_mode: true
attacker_train_mode: false

# Keep BatchNorm layers in eval mode for both victim and attacker passes: otherwise the
# victim normalizes by its own batch statistics and the target gradient is unreachable.
freeze_batchnorm: true

victim_batchsize: 1
max_iterations: 20000
max_trials: 1
init: randn
regularization: 0.00001 # TV regularization
use_grad_signs: true
clip_dummies: true
optimizer:
  name: Adam
  lr: 0.1
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0
scheduler:
  name: ReduceLROnPlateau
  metric: ReconstructionLoss
  use_loss: false
  mode: min
  factor: 0.1
  patience: 800
early_stopping:
  patience: 1500
  delta: 0
  metric: ReconstructionLoss
  use_loss: false
  subject_to: min
  verbose: false

